<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
 <policy user="etherhardware"><allow own="com.etherneco.EtherHardware1"/></policy>
 <policy context="default">
  <allow send_destination="com.etherneco.EtherHardware1" send_interface="org.freedesktop.DBus.Introspectable"/>
  <allow send_destination="com.etherneco.EtherHardware1" send_interface="org.freedesktop.DBus.Peer"/>
  <allow send_destination="com.etherneco.EtherHardware1" send_interface="com.etherneco.EtherHardware1"/>
 </policy>
</busconfig>
