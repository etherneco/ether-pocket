# Explicit RAM bring-up diagnostic. Hardware GPU acceptance remains blocked.
# Use only for diagnosing native X11 scanout on the downstream display driver.
Section "Files"
    ModulePath "/usr/local/lib/xorg/modules"
    ModulePath "/usr/lib/xorg/modules"
EndSection

Section "Device"
    Identifier "GM1920 diagnostic KMS"
    Driver "modesetting"
    Option "kmsdev" "/dev/dri/card0"
    Option "AccelMethod" "none"
    Option "ShadowFB" "true"
    Option "SWcursor" "true"
    Option "Monitor-Virtual-1" "IgnoreVirtual"
    Option "Monitor-DSI-1" "PhonePanel"
EndSection

Section "Monitor"
    Identifier "IgnoreVirtual"
    Option "Ignore" "true"
EndSection

Section "Monitor"
    Identifier "PhonePanel"
    Option "PreferredMode" "1080x2340x60x105300"
EndSection
