SectionVerb {
 # The downstream PCM driver needs a valid capture route before ACP probes it.
 EnableSequence [
  cset "name='AIF1_CAP Mixer SLIM TX0' 1"
  cset "name='SLIM_0_TX Channels' One"
  cset "name='CDC_IF TX0 MUX' DEC0"
  cset "name='ADC MUX0' AMIC"
  cset "name='AMIC MUX0' ADC3"
  cset "name='IIR0 INP0 MUX' DEC0"
  cset "name='ADC3 Volume' 6"
  cset "name='DEC0 Volume' 84"
  cset "name='MultiMedia1 Mixer SLIM_0_TX' 1,1"
 ]
 DisableSequence [
  cset "name='MultiMedia1 Mixer SLIM_0_TX' 0,0"
  cset "name='AIF1_CAP Mixer SLIM TX0' 0"
 ]
 Value { TQ "HiFi" }
}

SectionDevice."Speaker" {
 Comment "Phone speakers"
 EnableSequence [
  cset "name='QUAT_MI2S_RX Channels' Two"
  cset "name='QUAT_MI2S_RX Format' S24_LE"
  cset "name='QUAT_MI2S_RX SampleRate' KHZ_48"
  cset "name='stereo Profile' speaker"
  cset "name='Tfa Mute' 0"
  cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 1,1"
 ]
 DisableSequence [
  cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 0,0"
 ]
 Value {
  PlaybackPriority 100
  PlaybackPCM "hw:${CardId},0"
  PlaybackChannels 2
 }
}

# OEM mixer_paths_tavil.xml: audio-record + handset-mic-rec -> amic3.
SectionDevice."HandsetMic" {
 Comment "Phone microphone"
 EnableSequence [
  cset "name='AIF1_CAP Mixer SLIM TX0' 1"
  cset "name='SLIM_0_TX Channels' One"
  cset "name='CDC_IF TX0 MUX' DEC0"
  cset "name='ADC MUX0' AMIC"
  cset "name='AMIC MUX0' ADC3"
  cset "name='IIR0 INP0 MUX' DEC0"
  cset "name='ADC3 Volume' 6"
  cset "name='DEC0 Volume' 84"
  cset "name='MultiMedia1 Mixer SLIM_0_TX' 1,1"
 ]
 DisableSequence [
  cset "name='MultiMedia1 Mixer SLIM_0_TX' 0,0"
  cset "name='AIF1_CAP Mixer SLIM TX0' 0"
 ]
 Value {
  CapturePriority 100
  CapturePCM "hw:${CardId},0"
  CaptureChannels 1
  CaptureRate 48000
 }
}
