<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
 <policy user="root"><allow own="com.etherneco.EtherShare1"/></policy>
 <policy context="default">
  <allow send_destination="com.etherneco.EtherShare1"/>
  <allow receive_sender="com.etherneco.EtherShare1"/>
 </policy>
</busconfig>
