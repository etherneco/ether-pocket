<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
 <policy user="root"><allow own="com.etherneco.EtherFingerprint1"/></policy>
 <policy user="etherfp"><allow own="com.etherneco.EtherFingerprint1"/></policy>
 <policy context="default">
  <deny send_destination="com.etherneco.EtherFingerprint1"/>
  <allow send_destination="com.etherneco.EtherFingerprint1" send_interface="com.etherneco.EtherFingerprint1" send_member="GetState"/>
  <allow send_destination="com.etherneco.EtherFingerprint1" send_interface="com.etherneco.EtherFingerprint1" send_member="GetCapabilities"/>
  <allow send_destination="com.etherneco.EtherFingerprint1" send_interface="org.freedesktop.DBus.Introspectable"/>
  <allow send_destination="com.etherneco.EtherFingerprint1" send_interface="org.freedesktop.DBus.Properties"/>
 </policy>
</busconfig>
